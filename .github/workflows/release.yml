name: Build and Release

on:
  push:
    branches:
      - main  # Now triggers on regular pushes to the main branch

jobs:
  check-and-build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version
        id: version
        shell: python
        run: |
          import re, os
          content = open('gui.py', 'r', encoding='utf-8').read()
          ver = re.search(r'CURRENT_VERSION\s*=\s*"([^"]+)"', content).group(1)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"VERSION={ver}\n")

      - name: Check Tag Exists
        id: check_tag
        shell: bash
        run: |
          # Checks if the tag already exists remotely
          if git ls-remote --tags origin | grep -q "refs/tags/${{ env.VERSION }}"; then
            echo "Release for ${{ env.VERSION }} already exists. Skipping build."
            echo "SKIP_BUILD=true" >> $GITHUB_ENV
          else
            echo "New version detected: ${{ env.VERSION }}. Building new release!"
            echo "SKIP_BUILD=false" >> $GITHUB_ENV
          fi

      - name: Set up Python
        if: env.SKIP_BUILD == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: env.SKIP_BUILD == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Generate Icon
        if: env.SKIP_BUILD == 'false'
        run: python create_icon.py

      - name: Build with PyInstaller
        if: env.SKIP_BUILD == 'false'
        run: |
          python -m PyInstaller --noconsole --onefile --name "NebulaModManager" --clean -i "icon.ico" --add-data "icon.ico;." --collect-all customtkinter main.py

      - name: Upload Release
        if: env.SKIP_BUILD == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          files: dist/NebulaModManager.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
