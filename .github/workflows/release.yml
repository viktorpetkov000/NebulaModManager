name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ""

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-Increment Version
        id: version
        shell: python
        run: |
          import re, os, subprocess
          try:
              # Get latest tag from git history
              latest_tag = subprocess.check_output(['git', 'describe', '--tags', '--abbrev=0']).decode().strip()
          except Exception:
              # Fallback if no tags exist yet
              latest_tag = "v2.1.0"
              
          match = re.match(r'v(\d+)\.(\d+)(?:\.(\d+))?', latest_tag)
          if match:
              major = int(match.group(1))
              minor = int(match.group(2))
              new_version = f"v{major}.{minor + 1}.0"
          else:
              new_version = "v2.2.0"
              
          print(f"Bumping version from {latest_tag} to {new_version}")
              
          # Update gui.py
          with open('gui.py', 'r', encoding='utf-8') as f:
              content = f.read()
              
          content = re.sub(r'CURRENT_VERSION\s*=\s*"[^"]+"', f'CURRENT_VERSION = "{new_version}"', content, count=1)
          
          with open('gui.py', 'w', encoding='utf-8') as f:
              f.write(content)
              
          # Save for next steps
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"VERSION={new_version}\n")

      - name: Generate Changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            git log --pretty=format:"- %s" > changelog.txt
          else
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s" > changelog.txt
          fi

      - name: Commit Version Bump to GitHub
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gui.py
          # Commit only if changes exist, skip CI to prevent infinite loop
          git diff --staged --quiet || git commit -m "Auto-bump version to ${{ env.VERSION }} [skip ci]"
          git push origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Generate Icon
        run: python create_icon.py

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconsole --onefile --name "NebulaModManager" --clean -i "icon.ico" --add-data "icon.ico;." --collect-all customtkinter main.py

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          body_path: changelog.txt
          files: dist/NebulaModManager.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
